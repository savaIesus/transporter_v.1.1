[pycodestyle]
# E221/E241 — намеренное выравнивание столбцом: таблица переходов
#        StateMachine и блоки конфигурации ProductionCycle читаются
#        как таблица, ломать её ради стиля нельзя.
# E704 — однострочные заглушки (``def stub(self): pass``) в тестовых
#        дублёрах: разворачивать их в три строки только вредит читаемости.
# W503/W504 — перенос перед/после бинарного оператора: взаимоисключающие
#        правила, оба включать нельзя.
max-line-length = 100
exclude = .venv,.git,__pycache__,build,dist
ignore = E221,E241,E704,W503,W504

[tool:pytest]
testpaths = tests
python_files = test_*.py

[coverage:run]
# Замеряется только код приложения; сами тесты в отчёт не входят.
omit = tests/*
